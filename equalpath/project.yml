name: EqualPath
options:
  bundleIdPrefix: com.equalpath
  deploymentTarget:
    iOS: "17.0"
packages:
  Appwrite:
    url: https://github.com/appwrite/sdk-for-apple
    from: 18.3.0
targets:
  EqualPath:
    type: application
    platform: iOS
    sources:
      - EqualPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.equalpath.ios
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: EqualPath/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Appwrite
        product: Appwrite
  EqualPathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - EqualPathTests
    dependencies:
      - target: EqualPath
schemes:
  EqualPath:
    build:
      targets:
        EqualPath: all
        EqualPathTests: [test]
    test:
      targets:
        - EqualPathTests
